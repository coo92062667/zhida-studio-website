<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理員登入 · 智答工作室</title>
<style>
:root {
  --navy:   #1A2B4A;
  --orange: #FF6B35;
  --bg:     #F0F2F7;
  --surface:#FFFFFF;
  --muted:  #8898AA;
  --border: rgba(26,43,74,0.12);
  --red:    #EF4444;
  --green:  #22C55E;
  --radius: 12px;
  --font:   "Inter","Noto Sans TC","PingFang TC",sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: #0D1B35;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
a { text-decoration: none; color: inherit; }

.card {
  background: var(--surface);
  border-radius: 24px;
  padding: 40px 36px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.25);
}

/* Logo */
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.logo-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--orange);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; font-weight: 900; flex-shrink: 0;
}
.logo-name { font-size: 18px; font-weight: 800; color: var(--navy); }
.logo-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }

.title { font-size: 22px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.sub   { font-size: 14px; color: var(--muted); margin-bottom: 22px; }

/* Server URL section */
.server-section {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 20px;
}
.server-label {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.server-status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
}
.server-status-dot.ok  { background: var(--green); }
.server-status-dot.err { background: var(--red); }
.server-url-row { display: flex; gap: 8px; align-items: center; }
.server-url-row input {
  flex: 1;
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  color: var(--navy);
  background: var(--surface);
}
.server-url-row input:focus { outline: none; border-color: var(--orange); }
.btn-test {
  padding: 9px 14px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.2s;
}
.btn-test:hover { background: var(--orange); }
.btn-test:disabled { opacity: 0.55; cursor: default; }
.server-msg {
  font-size: 12px; margin-top: 8px; min-height: 16px;
  color: var(--muted);
}
.server-msg.ok  { color: var(--green); }
.server-msg.err { color: var(--red); }

/* Field */
.field-grp { margin-bottom: 14px; }
.field-label {
  display: block;
  font-size: 11px; font-weight: 700; color: var(--navy);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.field-wrap { position: relative; }

input[type="text"],
input[type="password"] {
  display: block;
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 15px;
  color: var(--navy);
  background: var(--bg);
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus,
input[type="password"]:focus {
  outline: none;
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(255,107,53,0.12);
}
input[type="password"] { padding-right: 44px; }

.eye-btn {
  position: absolute; right: 13px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--muted); font-size: 15px;
  cursor: pointer; padding: 4px;
  line-height: 1;
}

/* Login button */
.btn-submit {
  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-submit:hover { background: var(--orange); }

.err {
  min-height: 18px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--red);
  text-align: center;
}

.footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: rgba(255,255,255,0.3);
}
.footer a { color: rgba(255,255,255,0.45); text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">智</div>
    <div>
      <div class="logo-name">智答工作室</div>
      <div class="logo-sub">管理後台</div>
    </div>
  </div>

  <div class="title">管理員登入</div>
  <div class="sub">此頁面僅限授權人員使用</div>

  <!-- Server URL (always visible) -->
  <div class="server-section">
    <div class="server-label">
      <span class="server-status-dot" id="srv-dot"></span>
      伺服器網址
    </div>
    <div class="server-url-row">
      <input type="url" id="api-url" placeholder="https://your-ngrok-url.ngrok-free.dev">
      <button class="btn-test" id="btn-test" type="button">測試連線</button>
    </div>
    <div class="server-msg" id="srv-msg"></div>
  </div>

  <div class="field-grp">
    <label class="field-label" for="username">帳號</label>
    <input type="text" id="username" placeholder="管理員帳號">
  </div>

  <div class="field-grp">
    <label class="field-label" for="password">密碼</label>
    <div class="field-wrap">
      <input type="password" id="password" placeholder="密碼">
      <button class="eye-btn" id="eye-btn" type="button">👁</button>
    </div>
  </div>

  <button class="btn-submit" id="btn-login">登入後台</button>
  <div class="err" id="err"></div>
</div>

<div class="footer">
  <a href="../index.html">← 返回官網</a>
  &nbsp;·&nbsp; © 2026 智答工作室
</div>

<script>
'use strict';

const DEFAULT_API = '';

let apiBase = localStorage.getItem('admin_api') || DEFAULT_API;
document.getElementById('api-url').value = apiBase;

// ── Auto-detect server URL ──────────────────────────────────
async function autoDetectServer() {
  // Already have a saved URL → skip
  if (apiBase) return;

  setSrvStatus('', '自動偵測伺服器中…');
  const SKIP_HDR = { 'ngrok-skip-browser-warning': 'true' };
  const candidates = [
    'https://zhidastudio.com',   // future cloud
    'http://localhost:8000',      // local uvicorn
  ];

  for (const base of candidates) {
    try {
      const r = await fetch(base + '/api/server-info',
        { headers: SKIP_HDR, signal: AbortSignal.timeout(3000) });
      if (r.ok) {
        const data = await r.json();
        if (data.url) {
          apiBase = data.url;
          localStorage.setItem('admin_api', apiBase);
          document.getElementById('api-url').value = apiBase;
          setSrvStatus('ok', '✓ 自動偵測成功：' + apiBase);
          return;
        }
      }
    } catch {}
  }

  // Also try localhost health directly
  try {
    const r = await fetch('http://localhost:8000/api/health',
      { headers: SKIP_HDR, signal: AbortSignal.timeout(2000) });
    if (r.ok) {
      apiBase = 'http://localhost:8000';
      localStorage.setItem('admin_api', apiBase);
      document.getElementById('api-url').value = apiBase;
      setSrvStatus('ok', '✓ 偵測到本機伺服器');
      return;
    }
  } catch {}

  setSrvStatus('', '請手動填入 ngrok 網址');
}

autoDetectServer();

// Password visibility
document.getElementById('eye-btn').addEventListener('click', function() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  this.textContent = pw.type === 'password' ? '👁' : '🙈';
});

// Save URL on change
document.getElementById('api-url').addEventListener('change', function() {
  apiBase = this.value.trim() || DEFAULT_API;
  localStorage.setItem('admin_api', apiBase);
  setSrvStatus('', '');
});
document.getElementById('api-url').addEventListener('input', function() {
  apiBase = this.value.trim() || DEFAULT_API;
  setSrvStatus('', '');
});

// Test connection
document.getElementById('btn-test').addEventListener('click', testConnection);

function setSrvStatus(state, msg) {
  const dot = document.getElementById('srv-dot');
  const msgEl = document.getElementById('srv-msg');
  dot.className = 'server-status-dot' + (state ? ' ' + state : '');
  msgEl.className = 'server-msg' + (state ? ' ' + state : '');
  msgEl.textContent = msg;
}

async function testConnection() {
  const btn = document.getElementById('btn-test');
  const url = document.getElementById('api-url').value.trim() || DEFAULT_API;
  apiBase = url;
  localStorage.setItem('admin_api', apiBase);

  btn.disabled = true;
  btn.textContent = '測試中…';
  setSrvStatus('', '連線測試中…');

  try {
    const r = await fetch(apiBase + '/api/health', {
      method: 'GET',
      headers: { 'ngrok-skip-browser-warning': 'true' },
      signal: AbortSignal.timeout(6000),
    });
    if (r.ok) {
      setSrvStatus('ok', '✓ 伺服器連線正常');
    } else {
      setSrvStatus('ok', '✓ 伺服器有回應（HTTP ' + r.status + '）');
    }
  } catch (e) {
    setSrvStatus('err', '✗ 無法連線，請確認 ngrok 網址是否正確並已啟動');
  }

  btn.disabled = false;
  btn.textContent = '測試連線';
}

// Enter key
document.getElementById('username').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('btn-login').addEventListener('click', doLogin);

// Auto-redirect if already logged in
(function() {
  const t = localStorage.getItem('admin_token');
  const exp = parseFloat(localStorage.getItem('admin_exp') || '0');
  if (t && Date.now() / 1000 < exp) {
    location.replace('./index.html');
  }
})();

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  const btn   = document.getElementById('btn-login');

  if (!username || !password) {
    errEl.textContent = '請輸入帳號與密碼';
    return;
  }

  btn.textContent = '登入中…';
  errEl.textContent = '';

  try {
    const r = await fetch(apiBase + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      signal: AbortSignal.timeout(8000),
    });
    const res = await r.json();

    if (!res || !res.ok) {
      errEl.textContent = (res && res.error) ? res.error : '帳號或密碼錯誤';
      btn.textContent = '登入後台';
      return;
    }

    localStorage.setItem('admin_token', res.token);
    localStorage.setItem('admin_user',  username);
    localStorage.setItem('admin_exp',   String(res.expires || 0));
    localStorage.setItem('admin_api',   apiBase);
    location.replace('./index.html');

  } catch (e) {
    errEl.textContent = '無法連線到伺服器，請修改上方伺服器網址並點「測試連線」確認';
    setSrvStatus('err', '✗ 連線失敗');
    btn.textContent = '登入後台';
  }
}
</script>
</body>
</html>
